[package]
name = "project-generator-desktop"
version = "0.1.0"
description = "Internal Project Generator desktop packaging proof of concept"
authors = ["Project Generator"]
edition = "2024"

[features]
native-acceptance = []

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.4", features = [] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
